name: Deploy static content to Pages

on:
  push:
    # Deploy whenever the live branch changes. Add your GitHub Pages source
    # branch here if it differs.
    branches:
      - "main"
      - "claude/improve-data-sources-ReJEW"
      - "claude/financial-dashboard-HRwpo"
  schedule:
    # Refresh pre-fetched data daily at 6am UTC (after most FRED releases)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject FRED API keys
        run: |
          sed -i "s/__FRED_API_KEY_1__/${{ secrets.FRED_API_KEY_1 }}/g" config.js
          sed -i "s/__FRED_API_KEY_2__/${{ secrets.FRED_API_KEY_2 }}/g" config.js
      - name: Pre-fetch FRED data
        run: |
          mkdir -p data/fred
          SERIES="UNRATE CPIAUCSL BOGZ1FL153064486Q ICSA CCSA T10Y2Y FEDFUNDS"
          for s in $SERIES; do
            echo "Fetching $s..."
            TMP=$(mktemp)
            if curl -sf --retry 3 --retry-delay 5 --max-time 30 \
              "https://fred.stlouisfed.org/graph/fredgraph.csv?id=${s}" \
              -o "$TMP" && [ -s "$TMP" ] && head -1 "$TMP" | grep -qi "DATE"; then
              mv "$TMP" "data/fred/${s}.csv"
              echo "  OK: $(wc -l < data/fred/${s}.csv) lines"
            else
              rm -f "$TMP"
              if [ -f "data/fred/${s}.csv" ]; then
                echo "  FETCH FAILED — keeping existing file ($(wc -l < data/fred/${s}.csv) lines)"
              else
                echo "  WARNING: No data for $s and no existing file"
              fi
            fi
          done
      - name: Pre-fetch Yahoo Finance data
        run: |
          mkdir -p data/yahoo
          PERIOD1=$(date -d "35 years ago" +%s)
          PERIOD2=$(date +%s)
          for SYMBOL in "^GSPC" "^VIX"; do
            ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$SYMBOL'))")
            FILENAME=$(echo "$SYMBOL" | tr -d '^')
            echo "Fetching $SYMBOL..."
            FETCHED=false
            for HOST in query1 query2; do
              TMP=$(mktemp)
              if curl -sf --retry 3 --retry-delay 5 --max-time 60 \
                -H "User-Agent: Mozilla/5.0" \
                "https://${HOST}.finance.yahoo.com/v8/finance/chart/${ENCODED}?period1=${PERIOD1}&period2=${PERIOD2}&interval=1d&includeAdjustedClose=true" \
                -o "$TMP" && [ -s "$TMP" ] && python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d.get('chart',{}).get('result')" "$TMP"; then
                mv "$TMP" "data/yahoo/${FILENAME}.json"
                echo "  OK via ${HOST}: $(wc -c < data/yahoo/${FILENAME}.json) bytes"
                FETCHED=true
                break
              else
                rm -f "$TMP"
              fi
            done
            if [ "$FETCHED" = false ]; then
              if [ -f "data/yahoo/${FILENAME}.json" ]; then
                echo "  FETCH FAILED — keeping existing file ($(wc -c < data/yahoo/${FILENAME}.json) bytes)"
              else
                echo "  WARNING: No data for $SYMBOL and no existing file"
              fi
            fi
          done
      # Persist a baseline copy of the data into the repo so future runs have a
      # fallback if a live fetch fails. Never block the deploy on this — the
      # artifact already contains the freshly fetched data either way.
      - name: Commit pre-fetched data
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ -f
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore: refresh pre-fetched market data [skip ci]"
            # Explicit src:dst push works even from checkout's detached HEAD.
            git push origin "HEAD:${{ github.ref_name }}" \
              || echo "Push failed (enable Settings > Actions > Workflow permissions: Read and write). Deploy continues."
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
