name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  schedule:
    # Refresh FRED data daily at 6am UTC (after most FRED releases)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inject FRED API keys
        run: |
          sed -i "s/__FRED_API_KEY_1__/${{ secrets.FRED_API_KEY_1 }}/g" config.js
          sed -i "s/__FRED_API_KEY_2__/${{ secrets.FRED_API_KEY_2 }}/g" config.js
      - name: Pre-fetch FRED data
        run: |
          mkdir -p data/fred
          SERIES="UNRATE CPIAUCSL BOGZ1FL153064486Q ICSA T10Y2Y"
          for s in $SERIES; do
            echo "Fetching $s..."
            curl -sf --retry 3 --retry-delay 5 --max-time 30 \
              "https://fred.stlouisfed.org/graph/fredgraph.csv?id=${s}" \
              -o "data/fred/${s}.csv" \
              || echo "WARNING: Failed to fetch $s"
          done
          echo "Pre-fetched FRED files:"
          ls -la data/fred/
      - name: Pre-fetch Yahoo Finance data
        run: |
          mkdir -p data/yahoo
          PERIOD1=$(date -d "35 years ago" +%s)
          PERIOD2=$(date +%s)
          for SYMBOL in "^GSPC" "^VIX"; do
            ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$SYMBOL'))")
            FILENAME=$(echo "$SYMBOL" | tr -d '^')
            echo "Fetching $SYMBOL..."
            curl -sf --retry 3 --retry-delay 5 --max-time 60 \
              -H "User-Agent: Mozilla/5.0" \
              "https://query1.finance.yahoo.com/v8/finance/chart/${ENCODED}?period1=${PERIOD1}&period2=${PERIOD2}&interval=1d&includeAdjustedClose=true" \
              -o "data/yahoo/${FILENAME}.json" \
              || curl -sf --retry 3 --retry-delay 5 --max-time 60 \
                -H "User-Agent: Mozilla/5.0" \
                "https://query2.finance.yahoo.com/v8/finance/chart/${ENCODED}?period1=${PERIOD1}&period2=${PERIOD2}&interval=1d&includeAdjustedClose=true" \
                -o "data/yahoo/${FILENAME}.json" \
              || echo "WARNING: Failed to fetch $SYMBOL"
          done
          echo "Pre-fetched Yahoo files:"
          ls -la data/yahoo/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
